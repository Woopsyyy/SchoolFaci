name: CI and Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Vercel (Preview)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          vercel deploy --prebuilt --token=$VERCEL_TOKEN --yes \
            --env VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --env VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            --build-env VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-env VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            > vercel-preview-url.txt
          echo "PREVIEW_URL=$(cat vercel-preview-url.txt)" >> $GITHUB_ENV
          echo "### Preview URL" >> $GITHUB_STEP_SUMMARY
          echo "$(cat vercel-preview-url.txt)" >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Vercel (Production)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes \
            --env VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --env VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            --build-env VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-env VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} \
            > vercel-prod-url.txt
          echo "### Production URL" >> $GITHUB_STEP_SUMMARY
          echo "$(cat vercel-prod-url.txt)" >> $GITHUB_STEP_SUMMARY
